name: Publish PostgreSQL container

on:
  push:
    branches: [container-postgres]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-postgres-container
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'mihazs/mautic-pg'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the fork from its locked dependencies
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          build-args: VCS_REF=${{ github.sha }}
          tags: |
            ghcr.io/mihazs/mautic-pg:sha-${{ github.sha }}
            ghcr.io/mihazs/mautic-pg:postgres-7
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify a fresh PostgreSQL installation before publishing
        env:
          IMAGE: ghcr.io/mihazs/mautic-pg:sha-${{ github.sha }}
        run: |
          set -euo pipefail
          docker network create mautic-image-smoke
          docker run -d --name image-postgres --network mautic-image-smoke \
            -e POSTGRES_DB=mautic -e POSTGRES_USER=mautic -e POSTGRES_PASSWORD=image-test-password \
            --health-cmd='pg_isready -U mautic -d mautic' --health-interval=2s --health-retries=30 \
            postgres:18-bookworm
          for attempt in $(seq 1 60); do
            if [ "$(docker inspect -f '{{.State.Health.Status}}' image-postgres)" = healthy ]; then break; fi
            sleep 2
          done
          test "$(docker inspect -f '{{.State.Health.Status}}' image-postgres)" = healthy
          docker run -d --name image-mautic --network mautic-image-smoke -p 127.0.0.1:8080:80 \
            -e MAUTIC_DB_DRIVER=pdo_pgsql -e MAUTIC_DB_CHARSET=UTF8 \
            -e MAUTIC_DB_HOST=image-postgres -e MAUTIC_DB_PORT=5432 \
            -e MAUTIC_DB_NAME=mautic -e MAUTIC_DB_USER=mautic \
            -e MAUTIC_DB_PASSWORD=image-test-password -e MAUTIC_SECRET_KEY=image-test-secret \
            "$IMAGE"
          docker exec --user www-data image-mautic php bin/console mautic:install http://localhost:8080 \
            --db_driver=pdo_pgsql --db_host=image-postgres --db_port=5432 \
            --db_name=mautic --db_user=mautic --db_password=image-test-password \
            --db_table_prefix=image_ --admin_firstname=Image --admin_lastname=Smoke --admin_username=image-admin \
            --admin_email=image-admin@example.test --admin_password='Image-Test-Password-791!' --no-interaction --force
          schema_diff=$(docker exec --user www-data image-mautic php bin/console doctrine:schema:update --dump-sql 2>&1)
          printf '%s\n' "$schema_diff"
          [[ "$schema_diff" == *"Nothing to update"* ]]
          curl --fail --retry 10 --retry-all-errors --retry-delay 2 http://localhost:8080/s/login -o /tmp/mautic-login.html
          grep -q '_password' /tmp/mautic-login.html
          curl --fail http://localhost:8080/media/js/jquery.min.js -o /dev/null
          docker exec image-mautic pg_dump --version
      - name: Authenticate to the fork's container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the verified image
        run: |
          docker push "ghcr.io/mihazs/mautic-pg:sha-${GITHUB_SHA}"
          docker push ghcr.io/mihazs/mautic-pg:postgres-7
          digest=$(docker image inspect ghcr.io/mihazs/mautic-pg:postgres-7 --format '{{index .RepoDigests 0}}')
          printf 'Published: `%s`\n\nTags: `postgres-7`, `sha-%s`\n' "$digest" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
      - name: Show application logs on failure
        if: failure()
        run: docker logs image-mautic 2>&1 || true
      - name: Remove disposable smoke-test containers
        if: always()
        run: |
          docker rm -f image-mautic image-postgres 2>/dev/null || true
          docker network rm mautic-image-smoke 2>/dev/null || true
