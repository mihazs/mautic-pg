ServerName localhost
<Directory /var/www/html>
    AllowOverride All
    Require all granted
</Directory>
# Source and container metadata are never web content.
<DirectoryMatch "^/var/www/html/(docker|build|utils|tests)(/|$)">
    Require all denied
</DirectoryMatch>
<FilesMatch "^(Dockerfile|compose.*\.ya?ml|composer\.(json|lock)|package(-lock)?\.json)$">
    Require all denied
</FilesMatch>
